<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille & Florian 💍</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400;1,600&family=Nunito:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; background: linear-gradient(160deg, #f0fdf4 0%, #eefbf0 40%, #e2f4e5 100%); min-height: 100vh; color: #2f4f4f; }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .glass-card { background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(10px); border: 1px solid rgba(167, 243, 208, 0.4); box-shadow: 0 10px 40px rgba(110, 196, 152, 0.1); }
        .masonry { column-count: 2; column-gap: 1rem; }
        @media (min-width: 768px) { .masonry { column-count: 3; } }
        .masonry-item { break-inside: avoid; margin-bottom: 1rem; }
        input[type="file"]::file-selector-button { display: none; }
    </style>
</head>
<body class="antialiased pb-20">

    <div class="max-w-5xl mx-auto px-4 pt-16">
        <!-- En-tête -->
        <div class="text-center mb-12">
            <div class="text-3xl text-[#7eb28f] tracking-[0.3em] mb-4 opacity-70">✦ ✦ ✦</div>
            <h1 class="font-serif text-6xl md:text-8xl text-[#2a4531] mb-2">
                Camille <span class="italic text-[#81b29a]">&</span> Florian
            </h1>
            <p class="text-[#597a62] tracking-widest uppercase text-sm md:text-base mt-6">Nos Fiançailles</p>
            <div class="flex items-center justify-center gap-4 mt-8 max-w-md mx-auto">
                <div class="h-px bg-gradient-to-r from-transparent to-[#81b29a] flex-1"></div>
                <span class="text-2xl">🌿</span>
                <div class="h-px bg-gradient-to-l from-transparent to-[#81b29a] flex-1"></div>
            </div>
        </div>

        <!-- Section Upload -->
        <div class="max-w-2xl mx-auto glass-card rounded-3xl p-6 md:p-10 mb-16">
            <h2 class="font-serif text-3xl md:text-4xl text-center text-[#2a4531] mb-2">📸 Partagez vos souvenirs</h2>
            <p class="text-center text-[#597a62] mb-8">Immortalisez ce moment magique en ajoutant vos plus belles photos</p>

            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-[#416149] mb-2 ml-1">Votre prénom 🤍</label>
                    <input type="text" id="authorName" placeholder="Ex: Sophie, Marc..." class="w-full px-5 py-3 rounded-2xl bg-white border border-[#bce0c6] focus:outline-none focus:ring-2 focus:ring-[#81b29a] focus:border-transparent transition-all placeholder-[#a3c2af] text-[#2a4531]">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-[#416149] mb-2 ml-1">Vos photos 🌿</label>
                    <div class="relative group">
                        <div class="absolute inset-0 bg-gradient-to-br from-[#81b29a] to-[#a2d2b5] rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-300"></div>
                        <label for="fileInput" class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-[#81b29a] rounded-2xl cursor-pointer bg-white/50 hover:bg-white transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <span class="text-4xl mb-2">📥</span>
                                <p class="text-sm text-[#597a62] font-semibold">Cliquez pour sélectionner</p>
                                <p class="text-xs text-[#89a893] mt-1">JPG, PNG, WEBP</p>
                            </div>
                            <input id="fileInput" type="file" class="hidden" multiple accept="image/*" />
                        </label>
                    </div>
                    <div id="previewContainer" class="flex gap-3 mt-4 overflow-x-auto pb-2"></div>
                </div>

                <button id="submitBtn" class="w-full py-4 rounded-full bg-gradient-to-r from-[#6e9f86] to-[#81b29a] text-white font-bold text-lg shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300">
                    ✨ Envoyer mes photos
                </button>

                <div id="statusMessage" class="hidden text-center p-4 rounded-xl mt-4 font-semibold transition-all"></div>
                
                <!-- Barre de progression -->
                <div id="progressContainer" class="hidden w-full bg-white border border-[#bce0c6] rounded-full h-3 mt-2 overflow-hidden">
                    <div id="progressBar" class="bg-gradient-to-r from-[#6e9f86] to-[#a2d2b5] h-full rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-center gap-4 mt-8 mb-12 max-w-sm mx-auto">
            <div class="h-px bg-gradient-to-r from-transparent to-[#bce0c6] flex-1"></div>
            <span class="text-3xl">💍</span>
            <div class="h-px bg-gradient-to-l from-transparent to-[#bce0c6] flex-1"></div>
        </div>

        <!-- Section Galerie -->
        <div class="text-center mb-8">
            <h2 class="font-serif text-4xl text-[#2a4531]">Notre album partagé</h2>
        </div>

        <div id="gallery" class="masonry"></div>

        <div id="emptyGallery" class="text-center text-[#7eb28f] py-12 italic">
            Aucune photo pour l'instant... Soyez le premier à partager ! 💕
        </div>

        <!-- Pied de page -->
        <div class="text-center mt-20 font-serif italic text-[#6e9f86] text-xl">
            Avec tout notre amour — Camille & Florian
        </div>
    </div>

    <script>
        // --- CONFIGURATION ---
        // L'URL de votre Google Apps Script
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwO0cuTBpASOdBo7kM6R_3RVpgwi5h1t4dyOAqmQCOeYBi0_aLikTrWJVjDFohId9kZzw/exec";

        // --- ELEMENTS DU DOM ---
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const submitBtn = document.getElementById('submitBtn');
        const authorName = document.getElementById('authorName');
        const statusMessage = document.getElementById('statusMessage');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const gallery = document.getElementById('gallery');
        const emptyGallery = document.getElementById('emptyGallery');

        let selectedFiles = [];
        let galleryPhotos = [];

        // Gérer la sélection de fichiers et créer les miniatures
        fileInput.addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (file.type.startsWith('image/')) {
                    selectedFiles.push(file);
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        const imgDiv = document.createElement('div');
                        imgDiv.className = 'flex-shrink-0 w-20 h-20 rounded-lg overflow-hidden border-2 border-white shadow-sm relative group';
                        imgDiv.innerHTML = '<img src="' + event.target.result + '" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer text-white text-xs font-bold">X</div>';
                        
                        // Permettre de retirer une image
                        imgDiv.querySelector('div').addEventListener('click', function() {
                            const index = selectedFiles.indexOf(file);
                            if (index > -1) {
                                selectedFiles.splice(index, 1);
                            }
                            imgDiv.remove();
                        });

                        previewContainer.appendChild(imgDiv);
                    };
                    reader.readAsDataURL(file);
                }
            });
            fileInput.value = ''; // Réinitialiser l'input
        });

        // Fonction pour afficher un message
        function showStatus(msg, isSuccess) {
            statusMessage.textContent = msg;
            statusMessage.className = 'text-center p-4 rounded-xl mt-4 font-semibold ' + (isSuccess ? 'bg-[#d1e7d8] text-[#2a4531]' : 'bg-[#f8d7da] text-[#721c24]');
            statusMessage.classList.remove('hidden');
        }

        // Gérer l'envoi des fichiers
        submitBtn.addEventListener('click', async function() {
            statusMessage.classList.add('hidden');
            
            const name = authorName.value.trim();
            if (!name) {
                showStatus('Oops ! Indiquez votre prénom pour signer vos photos 💕', false);
                return;
            }
            if (selectedFiles.length === 0) {
                showStatus('Sélectionnez au moins une photo à partager 🌿', false);
                return;
            }

            // Désactiver le bouton et montrer la progression
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');
            submitBtn.textContent = "⏳ Envoi en cours...";
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '10%'; // Petite avancée visuelle immédiate

            let successCount = 0;
            const totalFiles = selectedFiles.length;

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    
                    // Lire le fichier en Base64
                    const base64Data = await new Promise((resolve) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    // Extraire uniquement la partie donnée du base64 (sans le header mime-type)
                    const base64String = base64Data.split(',')[1];
                    
                    // Préparer les données pour Google Apps Script
                    let formData = new URLSearchParams();
                    formData.append('fileName', name + "_" + file.name);
                    formData.append('mimeType', file.type);
                    formData.append('fileData', base64String);

                    // Envoyer la requête au serveur Google
                    const response = await fetch(GOOGLE_WEB_APP_URL, {
                        method: 'POST',
                        body: formData,
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
                    });

                    if (response.ok) {
                        successCount++;
                        // Ajouter à la galerie visuelle immédiatement (Optimistic UI)
                        galleryPhotos.unshift({
                            src: base64Data,
                            author: name
                        });
                    }

                    // Mettre à jour la barre de progression
                    const progress = Math.round(((i + 1) / totalFiles) * 100);
                    progressBar.style.width = progress + '%';
                }

                // Fin de la boucle d'envoi
                renderGallery();

                if (successCount > 0) {
                    showStatus('🎉 ' + successCount + ' photo(s) bien sauvegardée(s) dans le Drive, merci ' + name + ' ! 💖', true);
                    // Réinitialiser le formulaire
                    selectedFiles = [];
                    previewContainer.innerHTML = '';
                    authorName.value = '';
                } else {
                    showStatus('Une erreur est survenue lors de l\'enregistrement. 🙏', false);
                }

            } catch (error) {
                console.error("Erreur de connexion:", error);
                showStatus('Problème de connexion avec le serveur. Réessayez plus tard 🌿', false);
            } finally {
                // Restaurer le bouton
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');
                submitBtn.textContent = "✨ Envoyer mes photos";
                
                // Cacher la progression après un instant
                setTimeout(() => {
                    progressContainer.classList.add('hidden');
                    progressBar.style.width = '0%';
                }, 1000);

                // Cacher le message de succès après 6 secondes
                setTimeout(() => {
                    statusMessage.classList.add('hidden');
                }, 6000);
            }
        });

        // Fonction pour afficher la galerie
        function renderGallery() {
            if (galleryPhotos.length > 0) {
                emptyGallery.classList.add('hidden');
            } else {
                emptyGallery.classList.remove('hidden');
            }

            gallery.innerHTML = '';
            galleryPhotos.forEach(photo => {
                const item = document.createElement('div');
                item.className = 'masonry-item bg-white rounded-xl overflow-hidden shadow-sm border border-[#e8f3e9] transition-transform hover:-translate-y-1 hover:shadow-md';
                item.innerHTML = '<img src="' + photo.src + '" class="w-full h-auto" loading="lazy"><div class="p-3 bg-white border-t border-[#f0fdf4] text-center"><p class="text-sm font-semibold text-[#416149]">✨ ' + photo.author + '</p></div>';
                gallery.appendChild(item);
            });
        }
    </script>
</body>
</html>
